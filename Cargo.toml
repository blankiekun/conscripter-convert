[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
memmap2 = "0.9"
thiserror = "2"
webp = { version = "0.3", default-features = false }
conv-core = { path = "crates/conv-core" }
conv-engines = { path = "crates/conv-engines" }
conv-cons = { path = "crates/conv-cons" }
