name: check (cargo test, clippy)
on:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/check.yml']
  # every PR, so the required checks always report
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - run: cargo clippy --all-targets --locked -- -D warnings
    # Tests that need ffmpeg skip themselves without it.
    - run: cargo test --locked

  # main may only point at engine commits that are on CONscripter's master
  engine-on-master:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - run: |
        sha=$(git ls-tree HEAD engine | awk '{print $3}')
        status=$(gh api "repos/blankiekun/CONscripter/compare/master...$sha" --jq .status)
        echo "engine $sha is $status master"
        [ "$status" = identical ] || [ "$status" = behind ]
      env:
        GH_TOKEN: ${{ github.token }}

  # every repo path the docs name in backticks exists
  doc-paths:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - run: python3 -I research/tools/docpaths.py
