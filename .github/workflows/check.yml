name: check (cargo test, clippy)
on:
  # main only (for the rust-cache save): a PR branch's push run would only
  # repeat its pull_request run
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/check.yml']
  # every PR, so the required checks always report
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - run: cargo clippy --all-targets --locked -- -D warnings
    # Tests that need ffmpeg skip themselves without it.
    - run: cargo test --locked
    # lints live here: only `check` is a required status
    - run: python3 -I research/tools/docpaths.py
    - run: python3 -I research/tools/findings_lint.py
    - run: python3 -I research/tools/dropped_lint.py
    - run: research/tools/setup-venv.sh  # unicorn, then exe_call's self-test
    - run: python3 -I research/tools/ghidra/callmap.py --self-test
    - run: python3 -I research/tools/score_fell.py --self-test
    - run: git submodule update --init --depth 1 engine  # trace_diff imports engine/tools/cons_trace_check.py
    - run: python3 -I research/tools/frame_diff.py --self-test
    # agents must not put session lines in commits (user, 2026-10-17)
    - name: no Claude-Session lines in the PR's commits
      if: github.event_name == 'pull_request'
      run: |
        if git log --format=%B origin/${{ github.base_ref }}..HEAD^2 | grep -E 'Claude-Session:|https://claude\.ai/code/session'; then
          echo "remove the session line from the commits above"; exit 1
        fi

  # main may only point at engine commits that are on CONscripter's master
  engine-on-master:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - run: |
        sha=$(git ls-tree HEAD engine | awk '{print $3}')
        status=$(gh api "repos/blankiekun/CONscripter/compare/master...$sha" --jq .status)
        echo "engine $sha is $status master"
        [ "$status" = identical ] || [ "$status" = behind ]
      env:
        GH_TOKEN: ${{ github.token }}
